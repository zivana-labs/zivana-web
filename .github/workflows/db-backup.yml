name: Nightly Database Backup

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          repository: zivana-labs/zivana-db-backups
          token: ${{ secrets.BACKUP_REPO_TOKEN }}

      - name: Install Supabase CLI
        run: |
          curl -fsSL https://supabase.com/install.sh | sh
          echo "$HOME/.supabase/bin" >> $GITHUB_PATH

      - name: Run backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          mkdir -p backups
          supabase db dump --db-url "$SUPABASE_DB_URL" -f "backups/roles_${TIMESTAMP}.sql" --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f "backups/schema_${TIMESTAMP}.sql" --schema-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f "backups/data_${TIMESTAMP}.sql" --data-only
          # Keep only last 30 backup sets
          ls -t backups/roles_*.sql 2>/dev/null | tail -n +31 | xargs -r rm
          ls -t backups/schema_*.sql 2>/dev/null | tail -n +31 | xargs -r rm
          ls -t backups/data_*.sql 2>/dev/null | tail -n +31 | xargs -r rm
          echo "TIMESTAMP=${TIMESTAMP}" >> $GITHUB_ENV

      - name: Commit backup
        run: |
          git config user.name "Zivana Backup Bot"
          git config user.email "deployment@zivana.network"
          git add backups/
          git diff --staged --quiet || git commit -m "backup: ${{ env.TIMESTAMP }}"
          git push